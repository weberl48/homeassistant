# Bootlegger via compose (dev machines / any docker-compose host). In demo
# mode `api` runs everything in-process, so `docker compose up api` is the
# whole show. Live mode adds the pollers and the hands worker (design doc §2).
#
# NOTE: the household Pi runs HAOS, which has no compose — the ACTUAL prod
# deployment is ops/pi/deploy.sh (three `docker run`s mirroring these
# services). Keep the two in sync when services or env change.
services:
  api:
    build: ./server
    ports:
      - "8484:8484"
    env_file: [.env]
    volumes:
      - ./data:/data
    restart: unless-stopped

  ingest:
    build: ./server
    command: python -m app.ingest draft-poll
    env_file: [.env]
    volumes:
      - ./data:/data
    restart: unless-stopped
    profiles: [live]

  nightly:
    build: ./server
    entrypoint: ["sh", "-c", "while true; do sleep 86400; python -m app.ingest nightly; done"]
    env_file: [.env]
    volumes:
      - ./data:/data
    restart: unless-stopped
    profiles: [live]

  hands:
    build: ./server
    command: python -m hands.worker
    env_file: [.env]
    volumes:
      - ./data:/data
      - ./audit:/data/audit
    secrets:
      - sleeper_storage_state
    mem_limit: 1g            # Pi 5: memory-capped, single job at a time (§5.9)
    restart: unless-stopped
    profiles: [live]

secrets:
  sleeper_storage_state:
    file: ./storageState.json   # exported once from a desktop login; never committed
